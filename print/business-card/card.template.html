<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Визитка Zhubanov SoftDev — 90×50 мм</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&family=JetBrains+Mono:wght@500&display=block">
<style>
  /* .page = визитка 90×50 мм + вылеты по 2 мм (94×54). Chrome округляет формат PDF,
     поэтому печатаем лист 96×56 с запасом 1 мм, а точные 94×54 вырезает build.py.
     Все заливки непрозрачные: прозрачность в печатном PDF — лишний риск. */
  @page { size: 96mm 56mm; margin: 0; }
  :root {
    --bg: #0b1424;
    --bg-glow: #12384b;
    --watermark: #111d31;
    --text: #eef2f8;
    --text-2: #b9c4d6;
    --muted: #8a97ae;
    --cyan: #2cc4e8;
    --gold: #f3c24f;
    --rule: #1f3550;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #fff; }
  body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet {
    position: relative;
    width: 96mm;
    height: 56mm;
    overflow: hidden;
    break-after: page;
    background: var(--bg);
  }
  .sheet:last-child { break-after: auto; }
  .page {
    position: absolute;
    left: 1mm; top: 1mm;
    width: 94mm;
    height: 54mm;
    overflow: hidden;
    background: radial-gradient(95mm 70mm at 94mm 0mm, var(--bg-glow) 0%, #0e2336 38%, var(--bg) 72%);
    color: var(--text);
    font-family: "Inter", sans-serif;
  }
  /* Линии реза и безопасной зоны — только для превью, в печатный PDF не попадают */
  body.guides .page::after {
    content: "";
    position: absolute;
    left: 2mm; top: 2mm; width: 90mm; height: 50mm;
    outline: 0.2mm dashed #ff4d6d;
  }
  body.guides .page::before {
    content: "";
    position: absolute;
    left: 6mm; top: 6mm; width: 82mm; height: 42mm;
    outline: 0.15mm dotted #52ffa8;
    z-index: 5;
  }

  /* ---------- Лицевая сторона ---------- */
  .front .watermark {
    position: absolute;
    right: -9mm; top: 3mm;
    width: 52mm; height: 52mm;
  }
  .brand {
    position: absolute;
    left: 7mm; top: 11mm;
    display: flex; align-items: center; gap: 3.2mm;
  }
  .brand svg { width: 12.5mm; height: 12.5mm; }
  .wordmark { font-family: "Manrope", sans-serif; font-size: 15.5pt; letter-spacing: -0.01em; line-height: 1; white-space: nowrap; }
  .wordmark b { font-weight: 800; }
  .wordmark span { font-weight: 700; color: var(--cyan); margin-left: 0.8mm; }
  .tagline { position: absolute; left: 7mm; top: 28.5mm; }
  .tagline p:first-child { font-size: 8.4pt; font-weight: 500; color: var(--text); }
  .tagline p + p { margin-top: 0.9mm; font-size: 6.6pt; color: var(--muted); }
  .front .stack {
    position: absolute; left: 7mm; bottom: 7.2mm;
    display: flex; align-items: center; gap: 1.6mm;
    font-family: "JetBrains Mono", monospace; font-size: 6pt; letter-spacing: 0.08em;
    color: var(--text-2);
  }
  .front .stack i { width: 1.1mm; height: 1.1mm; border-radius: 50%; background: var(--cyan); }
  .front .stack i.gold { background: var(--gold); }

  /* ---------- Оборотная сторона ---------- */
  .back .person { position: absolute; left: 7mm; top: 7.2mm; }
  .back h1 { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 12.5pt; letter-spacing: -0.01em; line-height: 1.1; }
  .back .role { margin-top: 1.1mm; font-size: 6.8pt; font-weight: 600; color: var(--cyan); }
  .back .rule { position: absolute; left: 7mm; top: 18.8mm; width: 14mm; height: 0.35mm; background: var(--gold); }
  .contacts { position: absolute; left: 7mm; top: 21.6mm; list-style: none; }
  .contacts li { display: flex; align-items: center; gap: 1.8mm; height: 4.25mm; font-size: 7.1pt; color: var(--text); white-space: nowrap; }
  .contacts li small { color: var(--muted); font-size: 6.2pt; }
  .contacts svg { width: 2.9mm; height: 2.9mm; flex: none; color: var(--cyan); }
  .qr-box {
    position: absolute; right: 7mm; top: 7.2mm;
    width: 22mm; height: 22mm; border-radius: 2mm;
    background: #ffffff; padding: 1.6mm;
  }
  .qr-box svg { width: 100%; height: 100%; display: block; }
  .qr-caption { position: absolute; right: 7mm; top: 30.4mm; width: 22mm; text-align: center; font-size: 6pt; color: var(--muted); }
  .legal { position: absolute; right: 7mm; bottom: 7.2mm; font-size: 6pt; color: var(--muted); text-align: right; }
  .back .mini-logo { position: absolute; right: 7mm; bottom: 10.6mm; display: flex; align-items: center; gap: 1.2mm; }
  .back .mini-logo svg { width: 4mm; height: 4mm; }
  .back .mini-logo span { font-family: "Manrope", sans-serif; font-weight: 800; font-size: 6.6pt; }
  .back .mini-logo span em { font-style: normal; font-weight: 700; color: var(--cyan); margin-left: 0.5mm; }
</style>
</head>
<body class="{{BODY_CLASS}}">

<!-- ================= Лицевая сторона ================= -->
<div class="sheet"><section class="page front">
  <svg class="watermark" viewBox="0 0 32 32" aria-hidden="true">
    <path d="M8 9.5h11.5L8.5 21.5H20" fill="none" stroke="#111d31" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="21.5" y="20" width="4.5" height="2.8" rx="1" fill="#111d31"/>
  </svg>
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="8" fill="#0e1627" stroke="#1d6377" stroke-width="1.5"/>
      <path d="M8 9.5h11.5L8.5 21.5H20" fill="none" stroke="#2cc4e8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="21.5" y="20" width="4.5" height="2.8" rx="1" fill="#f3c24f"/>
    </svg>
    <div class="wordmark"><b>Zhubanov</b><span>SoftDev</span></div>
  </div>
  <div class="tagline">
    <p>Разработка ПО и прикладной ИИ</p>
    <p>Custom software development &amp; applied AI</p>
  </div>
  <div class="stack">RUBY ON RAILS <i></i> PYTHON <i></i> GO <i class="gold"></i> LLM</div>
</section></div>

<!-- ================= Оборотная сторона ================= -->
<div class="sheet"><section class="page back">
  <div class="person">
    <h1>{{NAME}}</h1>
    <p class="role">{{ROLE}}</p>
  </div>
  <div class="rule"></div>
  <ul class="contacts">
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 1.1 4.2 2 2 0 0 1 3.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L7.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
      <span>{{PHONE}} <small>· WhatsApp</small></span>
    </li>
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      {{EMAIL}}
    </li>
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.5 3.5-19 7.3 6.4 2.3 2.3 6.9 3.6-4.3 4.6 3.4z"/><path d="m8.9 13.1 9.1-6.6-6.8 8.4"/></svg>
      <span>{{TELEGRAM}} <small>· Telegram</small></span>
    </li>
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18 14 14 0 0 1 0-18z"/></svg>
      {{SITE_TEXT}}
    </li>
    <li>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.1-7-11.5a7 7 0 0 1 14 0C19 14.9 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      {{CITY}}
    </li>
  </ul>
  <div class="qr-box">{{QR_SVG}}</div>
  <p class="qr-caption">{{QR_CAPTION}}</p>
  <div class="mini-logo">
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="8" fill="#0e1627" stroke="#1d6377" stroke-width="1.5"/>
      <path d="M8 9.5h11.5L8.5 21.5H20" fill="none" stroke="#2cc4e8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="21.5" y="20" width="4.5" height="2.8" rx="1" fill="#f3c24f"/>
    </svg>
    <span>Zhubanov<em>SoftDev</em></span>
  </div>
  <p class="legal">{{LEGAL}}</p>
</section></div>

</body>
</html>
