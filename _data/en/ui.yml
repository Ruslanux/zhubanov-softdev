approach:
  eyebrow: "Approach"
  title: "AI you can trust"
  lead: >-
    The model reads and classifies — deterministic code computes the numbers and decisions, and an expert approves
    the result. That is why every number is reproducible and traceable to its source.
  pipeline:
    - { tag: "input", kind: "code", title: "Data", text: "Documents, scans, spreadsheets, BIM models, video streams, accounting systems." }
    - { tag: "LLM", kind: "llm", title: "The model reads", text: "Extracts facts, classifies, turns requirements into strict schemas." }
    - { tag: "engine", kind: "code", title: "Code computes", text: "Arithmetic, rules and verdicts live in a deterministic engine." }
    - { tag: "human", kind: "human", title: "An expert approves", text: "Ambiguous cases go to a specialist; decisions are recorded." }
    - { tag: "output", kind: "code", title: "Result", text: "A report, an API response or an action — traced back to the source document." }

