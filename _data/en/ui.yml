  about:
    eyebrow: "About"
    title: "Zhubanov SoftDev — a full-cycle engineering team"
    lead: >-
      We build custom software and implement applied artificial intelligence for businesses and the public sector
      in Kazakhstan and abroad.
    story:
      - >-
        Zhubanov SoftDev (Sole Proprietor Zhubanov R. Zh.) is a software development company. We build web services and
        backend systems, integrations and business-process automation, solutions based on large language models and
        agent pipelines, data processing, computer vision, geographic information systems and real-time systems.
      - >-
        Our portfolio includes education and e-commerce platforms, HR systems with multi-agent AI, fintech solutions,
        construction and BIM tools, field reference tools for industrial engineers, security and recognition systems,
        and modules for accounting and government systems.
      - >-
        We help companies automate routine operations, speed up workflows and make data-driven decisions.
        We deliver turnkey projects — discovery, design, development, testing, deployment and support — including
        documentation and training for the client's staff.
    facts:
      - { label: "Legal form", value: "Sole Proprietor Zhubanov R. Zh." }
      - { label: "Portfolio", value: "%p projects · %i industries", projects: true }
      - { label: "Technology", value: "Ruby on Rails · Python · Go · TypeScript" }
      - { label: "Geography", value: "Kazakhstan and worldwide, remote (UTC+5)" }
      - { label: "Working languages", value: "Қазақша · Русский · English" }
    quality:
      eyebrow: "Quality"
      title: "Engineering standards by default"
      lead: "What is usually sold as an add-on is part of every project we deliver."
      items:
        - { icon: "check-circle", title: "Automated tests", text: "Model, service, integration and system tests — from a hundred to a thousand tests per project." }
        - { icon: "shield", title: "Security", text: "Static analysis (Brakeman), dependency audits, access control, action audit logs and masking of sensitive data in logs." }
        - { icon: "flow", title: "CI/CD", text: "Linters, tests and security checks on every change; reproducible deployment with Docker and Kamal." }
        - { icon: "doc", title: "Documentation", text: "Architecture, admin and user guides, API docs, test reports and traceability to the requirements." }
        - { icon: "gauge", title: "AI cost control", text: "Request caching, token budgets, per-agent cost accounting and fallback model chains." }
        - { icon: "lock", title: "Confidentiality", text: "We work under NDA, deploy on the client's servers without the cloud and never use real data without consent." }
    models:
      eyebrow: "Engagement models"
      title: "Choose how we work together"
      lead: "A contract with a registered company, a transparent estimate and clear acceptance points."
      items:
        - tag: "Fixed price"
          title: "Turnkey project"
          text: "Fixed scope, timeline and price based on an agreed specification."
          points: ["Discovery and specification", "Stage-by-stage acceptance", "Warranty period"]
        - tag: "Prototype · MVP"
          title: "Rapid prototype"
          text: "Validate a hypothesis in a few weeks: a working prototype, metrics and a test report."
          points: ["Method and success criteria", "Clickable or working prototype", "Presentation for sign-off"]
        - tag: "Retainer"
          title: "Evolution and support"
          text: "A monthly budget of hours for product development, support and monitoring."
          points: ["Incident SLA", "Updates and security patches", "Priority access to the team"]
    founder:
      eyebrow: "Team"
      title: "Founder"
      initials: "RZ"
      name: "Ruslan Zhubanov"
      role: "Founder · Applied AI Engineer · Full-stack Ruby on Rails"
      bio:
        - >-
          More than five years in commercial software development. Designs LLM systems and takes them to production —
          agent pipelines and generative features inside products — along with the products themselves: the domain model,
          background queues, deployment and operations.
        - >-
          Working principle: the model reads and classifies, while deterministic code computes the numbers and verdicts —
          with strict call schemas, caching, self-audit and budgets.
