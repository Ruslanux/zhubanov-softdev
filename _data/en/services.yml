- id: erp
  icon: erp
  short: "Industry ERP"
  title: "Industry ERP implementation"
  summary: "Our own ERP for construction, agriculture, plants, oilfield services, mining, energy, distribution and logistics — from demo to a pilot on your data."
  text: >-
    We have a ready line of industry ERP systems on a shared core: request, approval, procurement, warehouse and budget
    vs. actual, plus the modules of your industry. So we never start from scratch: we show a working prototype, adapt it
    to your processes and run a pilot on one site, warehouse or branch.
  points:
    - "Requests from phones checked against the estimate or budget, with approval above the limit"
    - "Procurement, warehouse, budget vs. actual, timesheets, machinery and fuel"
    - "Industry modules: weighbridge, rotation and permits, metallurgical and fuel balances, shelf life, trips"
    - "Kazakh and Russian interface, a mobile version for foremen and supervisors"
    - "Integrations with 1C, e-invoicing, e-waybills and digital signatures; deployment on your servers"
    - "Migration of reference data and balances from Excel and 1C"
  deliverables:
    - "A system configured for your processes and roles"
    - "Pilot results and a test protocol"
    - "Staff training and role-based instructions"
    - "Support and further development under contract"
  products: [qurylys-erp, dala-erp, zauyt-erp, munai-erp, ken-erp, quat-erp, sauda-erp, jol-erp]

- id: ai
  icon: ai
  short: "AI agents"
  title: "AI agents and applied artificial intelligence"
  summary: "AI agents — digital employees on top of 1C, ERP and WhatsApp: e-invoice reconciliation, order intake, candidate screening, tender analysis."
  text: >-
    We embed large language models where they deliver measurable value. The model reads and classifies, while code
    computes the numbers, rules and verdicts — so results are reproducible, traceable and verifiable.
  points:
    - "AI accountant, WhatsApp order manager, AI recruiter, tender documentation agent"
    - "Multi-agent systems: a coordinator and specialized agents"
    - "In-product AI assistants that call your system's functions and respect permissions"
    - "Fact extraction from contracts, estimates, certificates, scans and spreadsheets, including vision models"
    - "Strict JSON Schema output contracts, self-audit and tracing"
    - "Quality evaluation: control sets, precision and recall"
    - "Caching, token budgets and model choice: Claude, DeepSeek, Kimi"
    - "Claude Code, Claude Agent SDK and MCP: agents that work with your code, data and tools"
  deliverables:
    - "A working pipeline or a module inside your system"
    - "A control set and a test report"
    - "A description of the method and its limits"
    - "An estimate of operating costs"
  products: [qyzmet]
  projects: [hr-agents, covenant-agent, ops-assistants, qa-agent, requirements-graph]

