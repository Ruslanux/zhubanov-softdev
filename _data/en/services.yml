- id: custom
  icon: code
  short: "Custom software"
  title: "Custom software development"
  summary: "Web services, SaaS, portals and user dashboards, backend systems and APIs — from MVP to high-load product."
  text: >-
    We design and build web platforms and backend systems around your processes: with a clear domain model,
    access control, background jobs and automated tests. Our core stack is Ruby on Rails 8 and PostgreSQL.
  points:
    - "Web platforms, SaaS and portals with dashboards for different roles"
    - "Backend systems, REST/JSON APIs and integration gateways"
    - "Multilingual interfaces (Kazakh, Russian, English), mobile-first and PWA"
    - "Real-time: chats, notifications and live dashboards over WebSocket"
    - "Payments, subscriptions, billing and marketplaces"
    - "Administration, roles and permissions, audit logs"
  deliverables:
    - "Source code and the rights to it"
    - "Architecture and API documentation"
    - "Automated tests and a configured CI"
    - "The application deployed on your servers or in the cloud"
  projects: [edu-center, marketplace, family-platform, mutual-aid]

- id: ai
  icon: ai
  short: "Applied AI and LLMs"
  title: "Applied artificial intelligence and LLM agents"
  summary: "Agent pipelines, AI assistants, document data extraction and content generation — with quality and cost control."
  text: >-
    We embed large language models where they deliver measurable value. The model reads and classifies, while code
    computes the numbers, rules and verdicts — so results are reproducible, traceable and verifiable.
  points:
    - "Multi-agent systems: a coordinator and specialized agents"
    - "In-product AI assistants that call your system's functions and respect permissions"
    - "Fact extraction from PDFs, scans and spreadsheets, including vision models"
    - "Strict JSON Schema output contracts, self-audit and tracing"
    - "Quality evaluation: control sets, precision and recall"
    - "Caching, token budgets and model choice: Claude, DeepSeek, Kimi"
    - "Claude Code, Claude Agent SDK and MCP: agents that work with your code, data and tools"
  deliverables:
    - "A working pipeline or a module inside your system"
    - "A control set and a test report"
    - "A description of the method and its limits"
    - "An estimate of operating costs"
  projects: [hr-agents, covenant-agent, ops-assistants, qa-agent, requirements-graph]

