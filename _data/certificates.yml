# Сертификаты систем менеджмента. Пока в списке нет записей с published: true —
# раздел «Сертификаты» на сайте скрыт (нет ни страницы, ни ссылок, ни блока в «О компании»).
#
# Как добавить сертификат:
#   1. Скан или PDF сертификата — в assets/certificates/ (например, iso27001.pdf).
#   2. Запись по образцу ниже; даты — в формате ГГГГ-ММ-ДД.
#   3. В certificates/index.html, kk/certificates/index.html, en/certificates/index.html
#      удалите строку «published: false».
#   4. Проверьте локально (bundle exec jekyll serve) и опубликуйте script/deploy.sh.
#
# Логотип ISO использовать нельзя — ISO это запрещает. Знак органа по сертификации — только по его
# правилам использования, выданным вместе с сертификатом.
#
# Образец:
#
# - id: iso27001
#   standard: "СТ РК ISO/IEC 27001-2023"
#   international: "ISO/IEC 27001:2022"          # идентичный международный стандарт
#   system:
#     ru: "Система менеджмента информационной безопасности"
#     kk: "Ақпараттық қауіпсіздікті басқару жүйесі"
#     en: "Information security management system"
#   number: "KZ.XXXX.XXXXXXX"                    # номер сертификата
#   issuer: "ТОО «…»"                            # орган по сертификации
#   accreditation: "аттестат аккредитации НЦА РК № …"
#   issued: 2027-01-15
#   valid_until: 2030-01-14
#   scope:
#     ru: "Разработка программного обеспечения, включая меры безопасной разработки; разработка, внедрение, эксплуатация и сопровождение облачных (SaaS) платформ и веб-сервисов"
#     kk: "…"
#     en: "…"
#   file: /assets/certificates/iso27001.pdf
#   verify_url: "https://…"                      # проверка в реестре органа по сертификации
#   published: true
[]
