- q: "Жоба қанша тұрады және қанша уақытқа созылады?"
  a: >-
    Көлеміне байланысты. Прототип немесе MVP — бірнеше аптадан, толыққанды платформа — екі-үш айдан басталады.
    Зерттеуден кейін кезеңдері мен қабылдау нүктелері көрсетілген смета береміз.
- q: "Ынтымақтастық қалай рәсімделеді?"
  a: >-
    ЖК Жубанов Р. Ж.-мен шарт, техникалық тапсырма, күнтізбелік жоспар және кезеңдер бойынша актілер.
    Қазақстан мен шетелдің компанияларымен жұмыс істейміз.
- q: "Бастапқы код пен құқықтар кімге тиесілі?"
  a: >-
    Шартта өзгеше көзделмесе, төлемнен кейін — тапсырыс берушіге. Бастапқы кодты, құжаттаманы және
    инфрақұрылымға қолжетімділікті тапсырамыз.
- q: "Деректердің құпиялылығын қалай қамтамасыз етесіздер?"
  a: >-
    NDA-ға қол қоямыз, шешімді сіздің серверлеріңізде және жабық контурда өрістете аламыз.
    Прототиптер үшін синтетикалық немесе иесіздендірілген деректерді пайдаланамыз.
- q: "Қандай ЖИ модельдері мен құралдарын қолданасыздар?"
  a: >-
    Негізгі құрал — Anthropic компаниясының Claude моделі. Өнімдерде Claude API-мен ресми SDK арқылы (Ruby, Python, TypeScript) жұмыс істейміз: құралдарды шақыру (tool use), JSON Schema бойынша құрылымдалған жауаптар, сканкөшірмелер мен PDF-ті оқу, құнды төмендету үшін промпттарды кэштеу және Batches API. Агенттерді Claude Agent SDK негізінде құрып, жүйелеріңізге MCP-серверлер арқылы қосамыз. Әзірлеудің өзінде Claude Code-ты қолданамыз — терминалда (CLI), IDE-де және CI/CD ішінде headless-режимде: ол жеткізуді жеделдетеді, ал код сол тесттер мен шолудан өтеді. Баға немесе өз серверлерде іске қосу маңызды болғанда DeepSeek пен Kimi-ді, ал қарапайым процессорларда ONNX-тегі ықшам меншікті модельдерді қолданамыз. Жүйені қайта жазбай-ақ модельді ауыстыруға болады.
- q: "Ірі компаниялардың технологиялық міндеттерін шешесіздер ме, тендерлерге қатысасыздар ма?"
  a: >-
    Иә. Тапсырыс берушілердің техникалық тапсырмалары бойынша тұжырымдамалар, прототиптер, презентациялар мен
    коммерциялық ұсыныстар дайындаймыз — әдісімен, сынақ есебімен және талаптарға трассировкамен.
- q: "Іске қосқаннан кейін не болады?"
  a: "Кепілдік мерзімі, SLA бойынша қолдау, өнімді дамыту және қызметкерлерді оқыту."
