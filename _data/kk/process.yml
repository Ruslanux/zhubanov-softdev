- title: "Зерттеу"
  text: "Процестерді, құжаттар мен шектеулерді зерделеп, мақсаттар мен табыс критерийлерін айқындаймыз."
- title: "Жобалау"
  text: "Архитектура, сценарийлер, интерфейс прототипі, жоспар және смета — шешім әзірлеу басталғанға дейін көрінеді."
- title: "Әзірлеу"
  text: "Демонстрациялары бар қысқа итерациялар және алғашқы апталардан бастап тест стенді."
- title: "Тестілеу"
  text: "Автотесттер, ЖИ-ге арналған бақылау жиынтықтары, қауіпсіздік тексерулері және қабылдау сынақтары."
- title: "Өрістету"
  text: "Сіздің серверлеріңізде, бұлтта немесе жабық контурда — мониторингпен және сақтық көшірмелермен."
- title: "Сүйемелдеу"
  text: "SLA бойынша қолдау, өнімді дамыту, құжаттама және қызметкерлерді оқыту."
