# Өнімдердің өзі — _products/<тіл>/<slug>.md (файл атауы = бет мекенжайы).

page:
  eyebrow: "Өнімдер"
  title: "Өз әзірлемелеріміз"
  lead: >-
    Ортақ ядродағы салалық ERP жүйелері және ЖИ-агенттер. Әр өнім — демо-деректердегі жұмыс істейтін прототип:
    оны онлайн көрсетеміз және сіздің деректеріңізде пилот іске қосамыз.

erp:
  eyebrow: "Салалық ERP"
  title: "Сегіз сала — бір сынақтан өткен ядро"
  lead: >-
    Өтінім, келісу, сатып алу, қойма және бюджет барлық нұсқада бірдей жұмыс істейді, ал салалық модульдер сіздің
    өндірісіңіздің тілінде сөйлейді: таразы, вахта мен рұқсаттар, металлургиялық және отын балансы, жарамдылық мерзімі.
  chain: ["Өтінім", "Келісу", "Жеткізушіге тапсырыс", "Қойма", "Бюджет жоспар-факт"]
  core_title: "Әр нұсқада бар"
  core:
    - { icon: flow, title: "Өтінімдер және келісу", text: "Телефоннан берілген өтінім смета немесе бюджет бойынша тексеріледі; бюджеттен тыс — тек негіздемемен келісіледі." }
    - { icon: ecommerce, title: "Жабдықтау және қойма", text: "Жеткізушіге тапсырыс, қабылдау, төлем; орташа баға бойынша қалдықтар; қалдықтан артық есептен шығаруға болмайды." }
    - { icon: gauge, title: "Бюджет жоспар-факт", text: "Excel-ден бюджет, баптар бойынша міндеттемелер мен факт, ауытқулар — басшының панелінде." }
    - { icon: user-check, title: "Персонал және техника", text: "Табель, рұқсаттар, машина-сағат және норманы ескерген отын." }
    - { icon: doc, title: "Есептер және жүктеп алу", text: "Рөлдер бойынша панельдер, басып шығаруға және PDF есептер, Excel, 1С-ке жүктеу." }
    - { icon: globe, title: "Қазақ және орыс тілдері", text: "Интерфейс пен хабарламалар қызметкердің тілінде, телефонға арналған мобильді нұсқа." }
    - { icon: lock, title: "Сіздің контуріңіз", text: "Сыртқы қаріптер мен CDN-сіз: сіздің серверлеріңізде және жабық желіде жұмыс істейді." }
    - { icon: check-circle, title: "Тестілермен тексерілген", text: "Өтінімнен бюджетке дейінгі сценарийлерді автотестілер тексереді." }

agents:
  eyebrow: "ЖИ-агенттер"
  title: "Есеп жүйеңіздің үстіндегі цифрлық қызметкерлер"
  lead: >-
    Агент процестің күнделікті бөлігін — салыстыруды, өтінімдерді қабылдауды, үміткерлерді іріктеуді, құжаттаманы
    талдауды — өз мойнына алып, дереккөзге сілтемесі бар жоба дайындайды. Шешімді қызметкер қабылдайды.

pilot:
  eyebrow: "Қалай бастау керек"
  title: "Демодан енгізуге дейін — төрт қадам"
  lead: "Әр қадамның соңында түсінікті нәтиже бар — келесіге өтпес бұрын оны қабылдайсыз."
  steps:
    - { title: "Демо", text: "Өнімді сіздің салаңыздың сценарийлерінде онлайн көрсетіп, сұрақтарға жауап береміз." }
    - { title: "Зерттеу", text: "Процестерді, құжаттар мен рөлдерді талдаймыз; ТТ, смета және пилот көрсеткіштерін дайындаймыз." }
    - { title: "Пилот", text: "Бір нысанда, қоймада немесе филиалда сіздің анықтамалықтарыңыз бен деректеріңізбен іске қосамыз." }
    - { title: "Енгізу", text: "1С, ЭШФ АЖ, ЕСУТД және ЭЦҚ интеграциялары, қызметкерлерді оқыту, сүйемелдеу." }

