- icon: cpu
  title: "Модель оқиды — код есептейді"
  text: "Арифметиканы, ережелер мен шешімдерді модельге сеніп тапсырмаймыз. Сондықтан нәтижені қайталауға және тексеруге болады."
- icon: user-check
  title: "Контурдағы сарапшы"
  text: "Күмәнді жағдайлар автоматты түрде жарияланбайды: оларды маман қарайды, ал шешімдер тіркеледі."
- icon: link
  title: "Қадағалау"
  text: "Әр сан өз дереккөзіне апарады: құжатқа, жолға, ұяшыққа, модель элементіне немесе транзакцияға."
- icon: offline
  title: "Бұлтсыз жұмыс істейді"
  text: "CPU-дағы модельдер, офлайн-карталар, жабық контур — деректер тапсырыс берушінің инфрақұрылымынан шықпайды."
- icon: check-circle
  title: "Әдепкі сапа"
  text: "Автотесттер, линтерлер, қауіпсіздік тексерулері және CI әр жобаға кіреді."
- icon: gauge
  title: "ЖИ-дің болжамды құны"
  text: "Кэштеу, токен бюджеттері және әр агент бойынша құнды есепке алу — шотта күтпеген жағдайлар болмайды."
