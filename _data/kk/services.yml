    жазбалар саны мен әр файл бойынша салыстырдық. Сайт шамамен 10 минут техникалық қызмет көрсетуде болды,
    бірде-бір жазба жоғалмады. Сонымен қатар Cloudflare-ды айналып өтетін тікелей сұраныстарға сервер жабылды,
    ал дерекқордың сақтық көшірмелері енді әр түн сайын бөлек қоймаға жіберіледі.
