    Танысу платформасы: сервер, дерекқор және сауалнама фотолары ЕО-дағы деректер орталығынан Алматыға
    (SmartCloud) көшірілді. Жүктемені жұмыс істеп тұрған серверде өлшедік, сондықтан артық қоры бар тарифті емес,
