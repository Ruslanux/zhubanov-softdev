- id: erp
  icon: erp
  short: "Отраслевые ERP"
  title: "Внедрение отраслевых ERP-систем"
  summary: "Собственные ERP для строительства, агро, заводов, нефтесервиса, горнодобычи, энергетики, дистрибуции и логистики — от демо до пилота на ваших данных."
  text: >-
    У нас готова линейка отраслевых ERP на общем ядре: заявка, согласование, закупка, склад и бюджет план-факт
    плюс модули вашей отрасли. Поэтому начинаем не с нуля: показываем работающий прототип, настраиваем его
    под ваши процессы и запускаем пилот на одном объекте, складе или филиале.
  points:
    - "Заявки с телефона с проверкой по смете или бюджету и согласованием сверх лимита"
    - "Снабжение, склад, бюджет план-факт, табель, техника и ГСМ"
    - "Отраслевые модули: весовая, вахта и допуски, металлургический и топливный балансы, сроки годности, рейсы"
    - "Казахский и русский интерфейс, мобильная версия для мастеров и прорабов"
    - "Интеграции с 1С, ИС ЭСФ, ЕСУТД и ЭЦП; развёртывание на ваших серверах"
    - "Перенос справочников и остатков из Excel и 1С"
  deliverables:
    - "Система, настроенная под ваши процессы и роли"
    - "Показатели пилота и протокол испытаний"
    - "Обучение сотрудников и инструкции по ролям"
    - "Сопровождение и развитие по договору"
  products: [qurylys-erp, dala-erp, zauyt-erp, munai-erp, ken-erp, quat-erp, sauda-erp, jol-erp]

- id: ai
  icon: ai
  short: "ИИ-агенты"
  title: "ИИ-агенты и прикладной искусственный интеллект"
  summary: "ИИ-агенты — «цифровые сотрудники» поверх 1С, ERP и WhatsApp: сверка ЭСФ, приём заказов, отбор откликов, разбор тендерной документации."
