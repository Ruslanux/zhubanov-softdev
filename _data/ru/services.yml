- id: custom
  icon: code
  short: "Разработка ПО"
  title: "Разработка программного обеспечения на заказ"
  summary: "Веб-сервисы, SaaS, порталы и личные кабинеты, серверные системы и API — от MVP до нагруженного продукта."
  text: >-
    Проектируем и создаём веб-платформы и серверные системы вокруг ваших процессов: с понятной доменной
    моделью, разграничением прав, фоновыми задачами и автотестами. Основной стек — Ruby on Rails 8 и PostgreSQL.
  points:
    - "Веб-платформы, SaaS и порталы с личными кабинетами для разных ролей"
    - "Серверные системы, REST/JSON API и интеграционные шлюзы"
    - "Мультиязычные интерфейсы (қазақша, русский, English), mobile-first и PWA"
    - "Real-time: чаты, уведомления и живые панели на WebSocket"
    - "Платежи, подписки, биллинг и маркетплейсы"
    - "Администрирование, роли и права, журнал действий"
  deliverables:
    - "Исходный код и права на него"
    - "Архитектурная документация и описание API"
    - "Автотесты и настроенный CI"
    - "Развёрнутое приложение на ваших серверах или в облаке"
  projects: [edu-center, marketplace, family-platform, mutual-aid]

- id: ai
  icon: ai
  short: "Прикладной ИИ и LLM"
  title: "Прикладной искусственный интеллект и LLM-агенты"
  summary: "Агентные конвейеры, ИИ-помощники, извлечение данных из документов и генерация контента — с контролем качества и стоимости."
  text: >-
    Встраиваем большие языковые модели туда, где они приносят измеримую пользу. Модель читает и классифицирует,
    а числа, правила и вердикты считает код — поэтому результат воспроизводим, прослеживаем и проходит проверку.
  points:
    - "Мультиагентные системы: координатор и профильные агенты"
    - "ИИ-помощники внутри продукта с вызовом функций вашей системы и учётом прав"
    - "Извлечение фактов из PDF, сканов и таблиц, в том числе vision-моделями"
    - "Строгие контракты вывода по JSON Schema, самоаудит и трассировка"
    - "Оценка качества: контрольные наборы, точность и полнота"
    - "Кеширование, бюджеты токенов и выбор модели: Claude, DeepSeek, Kimi"
    - "Claude Code, Claude Agent SDK и MCP: агенты, которые работают с вашим кодом, данными и инструментами"
  deliverables:
    - "Рабочий конвейер или модуль в вашей системе"
    - "Контрольный набор и отчёт об испытаниях"
    - "Описание метода и ограничений"
    - "Расчёт стоимости эксплуатации"
  projects: [hr-agents, covenant-agent, ops-assistants, qa-agent, requirements-graph]

- id: automation
  icon: flow
  short: "Интеграции и автоматизация"
  title: "Интеграции и автоматизация бизнес-процессов"
  summary: "Связываем учётные системы, платежи, ЭЦП и мессенджеры, убираем ручной ввод и двойную работу."
  text: >-
    Автоматизируем рутинные операции и связываем разрозненные системы в единый процесс — с журналом обмена,
    повторной обработкой ошибок и понятными статусами для сотрудников.
  points:
    - "Интеграции с 1С, CRM, ERP и внутренними системами"
    - "Платёжные шлюзы Kaspi, Halyk Epay, Freedom с идемпотентной обработкой вебхуков"
    - "Электронный документооборот и подписание ЭЦП"
    - "Уведомления: email, web-push, Slack, Microsoft Teams"
    - "Фоновые задачи и расписания: отчёты, сверки, рассылки"
    - "CI/CD-интеграции: GitHub Actions, GitLab CI, Azure DevOps"
  deliverables:
    - "Описание контрактов интеграции"
    - "Журнал обмена и мониторинг ошибок"
    - "Сценарии восстановления"
    - "Инструкции для персонала"
  projects: [reconciliation, marketplace, qa-agent]

- id: vision
  icon: scan
  short: "Данные и компьютерное зрение"
  title: "Обработка данных и компьютерное зрение"
  summary: "Распознавание номеров, OCR, разбор смет и BIM-моделей, аналитика и отчётность на данных."
  text: >-
    Превращаем видео, фото, сканы, таблицы и инженерные модели в структурированные данные, с которыми
    можно работать. Модели запускаем на обычных процессорах — без облака и дорогого оборудования.
  points:
    - "Распознавание объектов и текста на видео, в том числе ночью и на обычных IP-камерах"
    - "OCR документов и бирок оборудования, проверка по справочникам"
    - "BIM (IFC): проверки моделей, привязка объёмов, 3D-просмотр"
    - "Разбор смет, актов и реестров из XLSX и PDF"
    - "Модели на CPU без облака: ONNX Runtime, OpenCV"
    - "Панели, аналитика, выгрузки в Excel и PDF-отчёты"
  deliverables:
    - "Модель или конвейер обработки"
    - "Метрики на контрольной выборке"
    - "API для интеграции"
    - "Docker-образ для развёртывания"
  projects: [night-anpr, bim-standards, bim-volumes, instrumentation]

- id: realtime
  icon: map
  short: "ГИС и реальное время"
  title: "Геоинформационные системы и системы реального времени"
  summary: "Мониторинг и управление распределёнными объектами 24/7, офлайн-карты, триангуляция и рабочие места операторов."
  text: >-
    Создаём системы, которые работают круглосуточно и не зависят от интернета: центры мониторинга,
    агенты на удалённых узлах, картографию в закрытом контуре и рабочие места операторов.
  points:
    - "Центры мониторинга и управления сетью удалённых комплексов и датчиков"
    - "Офлайн-ГИС: локальный картографический сервер, зоны и траектории"
    - "Агенты на узлах с буферизацией и автономным режимом при потере связи"
    - "Многооконные АРМ операторов с цветовой и звуковой сигнализацией"
    - "Журналы инцидентов, воспроизведение событий и отчёты"
    - "Режим 24/7, автовосстановление и разграничение прав"
  deliverables:
    - "Сервер и агенты под Windows и Linux"
    - "Установщики: служба Windows, systemd, Docker"
    - "Руководства администратора и оператора"
    - "Описание протокола сопряжения и API"
  projects: [counter-uav, night-anpr]

- id: discovery
  icon: layers
  short: "Концепции и прототипы"
  title: "Обследование, концепции и прототипы"
  summary: "Разбираем ТЗ, проектируем архитектуру и показываем решение на прототипе ещё до начала разработки."
  text: >-
    Снижаем риски до того, как вложены основные деньги: формулируем метод и критерии приёмки,
    проектируем архитектуру и показываем решение на кликабельном прототипе или рабочем MVP.
  points:
    - "Обследование процессов и анализ технического задания"
    - "Концепция: сценарии, архитектура, матрица доступа, безопасность"
    - "Кликабельные UI-прототипы и рабочие MVP"
    - "Метод, критерии приёмки и протокол испытаний"
    - "Презентации и материалы для защиты проекта и тендеров"
    - "Оценка сроков, стоимости и план развития"
  deliverables:
    - "Концепция и архитектурные схемы"
    - "Прототип, который открывается в браузере"
    - "Презентация для приёмки"
    - "Смета и дорожная карта"
  projects: [access-management, payments-mor, bim-standards]

- id: devops
  icon: server
  short: "Развёртывание и поддержка"
  title: "Развёртывание, DevOps и сопровождение"
  summary: "Выводим в продакшен и поддерживаем: контейнеры, CI/CD, мониторинг, резервные копии и обучение персонала."
  text: >-
    Доводим систему до эксплуатации и остаёмся рядом: настраиваем инфраструктуру, автоматизируем выпуск версий,
    обучаем администраторов и пользователей, поддерживаем по SLA.
  points:
    - "Docker, Kamal 2, systemd; Hetzner, облако или серверы заказчика"
    - "Работа в закрытом контуре и без интернета"
    - "CI/CD, автоматические проверки и откат версий"
    - "TLS, Cloudflare, S3-совместимые хранилища"
    - "Мониторинг, журналы и резервное копирование"
    - "Обучение сотрудников и передача знаний"
  deliverables:
    - "Воспроизводимая конфигурация инфраструктуры"
    - "Инструкции по развёртыванию и восстановлению"
    - "Поддержка по SLA"
    - "Обучение администраторов и пользователей"
  projects: [instrumentation, counter-uav, code-school]

- id: audit
  icon: shield
  short: "Аудит и модернизация"
  title: "Аудит кода, безопасность и модернизация"
  summary: "Проверяем существующие системы, закрываем уязвимости, обновляем стек и ускоряем приложение."
  text: >-
    Разбираем унаследованные системы и возвращаем им управляемость: находим узкие места и уязвимости,
    покрываем тестами критичные сценарии и обновляем стек без остановки бизнеса.
  points:
    - "Ревью кода и архитектуры с приоритизированным списком находок"
    - "Анализ безопасности: Brakeman, аудит зависимостей, права доступа"
    - "Обновление Ruby и Rails до актуальных версий"
    - "Покрытие тестами критичных сценариев"
    - "Оптимизация запросов к базе данных и производительности"
    - "Рекомендации по стеку и архитектуре"
  deliverables:
    - "Отчёт с находками и планом исправлений"
    - "Исправления по согласованию"
    - "Тесты на критичные сценарии"
    - "Рекомендации по развитию"
  projects: [stack-advisor, qa-agent]
