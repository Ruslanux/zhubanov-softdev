- id: migration
  icon: pin
  short: "Переезд сервера в РК"
  title: "Переезд и настройка сервера в Казахстане"
  summary: "Переносим сайт, базу данных и файлы на сервер в Казахстане — под требование закона о хранении персональных данных в РК, без потери данных и с коротким окном обслуживания."
  text: >-
    Закон РК «О персональных данных и их защите» требует хранить базы с персональными данными граждан
    на территории Казахстана. Переносим действующую систему с зарубежного хостинга в казахстанский ЦОД:
    подбираем конфигурацию по реальной нагрузке, настраиваем сервер с нуля, переносим данные с проверкой
    и переключаем трафик так, что пользователи замечают только короткое окно обслуживания.
  points:
    - "Замер реальной нагрузки и выбор тарифа: VDS, IaaS, объектное хранилище S3"
    - "Подготовка сервера: Docker, Kamal 2, своп, автообновления безопасности"
    - "Фаервол: веб-порты открыты только для Cloudflare, прямой доступ к серверу по IP закрыт"
    - "Перенос базы данных и файлов со сверкой записей и проверкой каждого объекта"
    - "Репетиция переезда на копии данных, план отката, переключение DNS"
    - "Резервные копии базы — в отдельное хранилище с собственными ключами доступа"
    - "Обновление политики конфиденциальности: место хранения и получатели данных"
  deliverables:
    - "Система работает на сервере в Казахстане"
    - "Конфигурация развёртывания в вашем репозитории"
    - "Ежедневные резервные копии вне сервера"
    - "Инструкция по эксплуатации и откату"
  example: >-
    Платформа знакомств: сервер, база данных и фото анкет переехали из ЦОД в ЕС в Алматы (SmartCloud).
    Нагрузку замерили на действующем сервере, поэтому взяли VDS на 2 ядра и 2 ГБ памяти, а не тариф с запасом.
    Перенос базы и файлов отрепетировали заранее и сверили по числу записей в ключевых таблицах и по каждому
    файлу. Сайт был закрыт на обслуживание около 10 минут, ни одна запись не потерялась. Заодно сервер закрыли
    для прямых обращений в обход Cloudflare, а резервные копии базы теперь каждую ночь уходят в отдельное хранилище.
  projects: [family-platform]

