- q: "Сколько стоит и сколько длится проект?"
  a: >-
    Зависит от объёма. Прототип или MVP — от нескольких недель, полноценная платформа — от двух-трёх месяцев.
    После обследования даём смету с этапами и точками приёмки.
- q: "Как оформляется сотрудничество?"
  a: >-
    Договор с ИП Жубанов Р. Ж., техническое задание, календарный план и акты по этапам.
    Работаем с компаниями Казахстана и зарубежья.
- q: "Кому принадлежат исходный код и права?"
  a: >-
    Заказчику после оплаты, если договором не предусмотрено иное. Передаём исходный код,
    документацию и доступы к инфраструктуре.
- q: "Как вы обеспечиваете конфиденциальность данных?"
  a: >-
    Подписываем NDA, можем развернуть решение на ваших серверах и в закрытом контуре.
    Для прототипов используем синтетические или обезличенные данные.
- q: "Какие модели и инструменты ИИ вы используете?"
  a: >-
    Основной инструмент — Claude от Anthropic. В продуктах работаем с Claude API через официальные SDK (Ruby, Python, TypeScript): вызов инструментов (tool use), структурированные ответы по JSON Schema, чтение сканов и PDF, кеширование промптов и Batches API для снижения стоимости. Агентов строим на Claude Agent SDK и подключаем к вашим системам через MCP-серверы. В самой разработке используем Claude Code — в терминале (CLI), в IDE и в headless-режиме внутри CI/CD: он ускоряет поставку, а код проходит те же тесты и ревью. Когда важны цена или запуск на своих серверах, применяем DeepSeek и Kimi, а на обычных процессорах — компактные собственные модели в ONNX. Модель можно сменить без переписывания системы.
- q: "Решаете ли вы технологические задачи крупных компаний и участвуете в тендерах?"
  a: >-
    Да. Готовим концепции, прототипы, презентации и коммерческие предложения по техническим заданиям
    заказчиков — с методом, отчётом об испытаниях и трассировкой на требования.
- q: "Что происходит после запуска?"
  a: "Гарантийный период, поддержка по SLA, развитие продукта и обучение сотрудников."
