approach:
  eyebrow: "Подход"
  title: "ИИ, которому можно доверять"
  lead: >-
    Модель читает и классифицирует — числа и решения считает детерминированный код, а эксперт утверждает
    результат. Поэтому каждое число воспроизводимо и прослеживается до источника.
  pipeline:
    - { tag: "input", kind: "code", title: "Данные", text: "Документы, сканы, таблицы, BIM-модели, видеопотоки, учётные системы." }
    - { tag: "LLM", kind: "llm", title: "Модель читает", text: "Извлекает факты, классифицирует, переводит требования в строгие схемы." }
    - { tag: "engine", kind: "code", title: "Код считает", text: "Арифметика, правила и вердикты — в детерминированном движке." }
    - { tag: "human", kind: "human", title: "Эксперт утверждает", text: "Спорные случаи уходят специалисту, решения фиксируются." }
    - { tag: "output", kind: "code", title: "Результат", text: "Отчёт, API или действие — с трассой до исходного документа." }

