    eyebrow: "О компании"
    title: "Zhubanov SoftDev — инженерная команда полного цикла"
    lead: >-
      Мы создаём программное обеспечение на заказ и внедряем прикладной искусственный интеллект
      для бизнеса и государственного сектора Казахстана и зарубежья.
    story:
      - >-
        Zhubanov SoftDev (ИП Жубанов Р. Ж.) — компания по разработке программного обеспечения.
        Мы строим веб-сервисы и серверные системы, интеграции и автоматизацию бизнес-процессов,
        решения на основе больших языковых моделей и агентных конвейеров, обработку данных,
        компьютерное зрение, геоинформационные системы и системы реального времени.
      - >-
        В портфолио — платформы для образования и электронной коммерции, HR-системы с мультиагентным ИИ,
        финтех-решения, инструменты для строительства и BIM, промышленные справочники для инженеров,
        системы безопасности и распознавания, модули для учётных и государственных систем.
      - >-
        Помогаем компаниям автоматизировать рутинные операции, ускорять процессы и принимать решения на данных.
        Выполняем проекты под ключ: обследование, проектирование, разработку, тестирование, развёртывание и
        сопровождение — с документацией и обучением сотрудников заказчика.
    facts:
      - { label: "Организационная форма", value: "ИП Жубанов Р. Ж." }
      - { label: "Портфолио", value: "%p проектов · %i отраслей", projects: true }
      - { label: "Технологии", value: "Ruby on Rails · Python · Go · TypeScript" }
      - { label: "География", value: "Казахстан и зарубежье, удалённо (UTC+5)" }
      - { label: "Языки работы", value: "Қазақша · Русский · English" }
    quality:
      eyebrow: "Качество"
      title: "Инженерные стандарты по умолчанию"
      lead: "То, что обычно продаётся как опция, у нас входит в каждый проект."
      items:
        - { icon: "check-circle", title: "Автотесты", text: "Модели, сервисы, интеграционные и системные тесты. В поставках — от сотни до тысячи тестов на проект." }
        - { icon: "shield", title: "Безопасность", text: "Статический анализ (Brakeman), аудит зависимостей, разграничение прав, аудит действий, маскирование данных в логах." }
        - { icon: "flow", title: "CI/CD", text: "Линтеры, тесты и проверки безопасности на каждое изменение; воспроизводимое развёртывание в Docker и Kamal." }
        - { icon: "doc", title: "Документация", text: "Архитектура, руководства администратора и пользователя, API, протоколы испытаний и трассировка на требования ТЗ." }
        - { icon: "gauge", title: "Контроль стоимости ИИ", text: "Кеширование запросов, бюджеты токенов, учёт стоимости по агентам и резервные цепочки моделей." }
        - { icon: "lock", title: "Конфиденциальность", text: "Работаем по NDA, разворачиваем решения на серверах заказчика и без облака, не используем реальные данные без согласия." }
    models:
      eyebrow: "Форматы работы"
      title: "Выберите удобную модель сотрудничества"
      lead: "Договор с ИП, прозрачная смета и понятные точки приёмки."
      items:
        - tag: "Fixed price"
          title: "Проект под ключ"
          text: "Фиксированные объём, срок и стоимость по согласованному техническому заданию."
          points: ["Обследование и ТЗ", "Поэтапная приёмка", "Гарантийный период"]
        - tag: "Прототип · MVP"
          title: "Быстрый прототип"
          text: "Проверяем гипотезу за несколько недель: работающий прототип, метрики и отчёт об испытаниях."
          points: ["Метод и критерии успеха", "Кликабельный или рабочий прототип", "Презентация для защиты"]
        - tag: "Retainer"
          title: "Развитие и сопровождение"
          text: "Ежемесячный объём часов на развитие продукта, поддержку и мониторинг."
          points: ["SLA на инциденты", "Обновления и безопасность", "Приоритетный доступ к команде"]
    founder:
      eyebrow: "Команда"
      title: "Основатель"
      initials: "РЖ"
      name: "Руслан Жубанов"
      role: "Основатель · Applied AI Engineer · Full-stack Ruby on Rails"
      bio:
        - >-
          Более пяти лет в коммерческой разработке. Проектирует и доводит до продакшена LLM-системы —
          агентные конвейеры и генеративные функции внутри продукта — и сами продукты: доменную модель,
          фоновые очереди, развёртывание и эксплуатацию.
        - >-
          Принцип работы: модель читает и классифицирует, а числа и вердикты считает детерминированный код —
          со строгими схемами вызовов, кешированием, самоаудитом и бюджетами.
