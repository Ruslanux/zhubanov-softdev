- title: "Обследование"
  text: "Изучаем процессы, документы и ограничения, формулируем цели и критерии успеха."
- title: "Проектирование"
  text: "Архитектура, сценарии, прототип интерфейса, план и смета — решение видно до начала разработки."
- title: "Разработка"
  text: "Короткие итерации с демонстрациями и тестовым стендом с первых недель."
- title: "Тестирование"
  text: "Автотесты, контрольные наборы для ИИ, проверки безопасности и приёмочные испытания."
- title: "Развёртывание"
  text: "На ваших серверах, в облаке или в закрытом контуре — с мониторингом и резервными копиями."
- title: "Сопровождение"
  text: "Поддержка по SLA, развитие продукта, документация и обучение сотрудников."
