# Раздел «Продукты»: общие тексты обзорной страницы и страниц продуктов.
# Сами продукты — в _products/<язык>/<slug>.md (имя файла = адрес страницы).

page:
  eyebrow: "Продукты"
  title: "Собственные разработки"
  lead: >-
    Отраслевые ERP-системы на общем ядре и ИИ-агенты. Каждый продукт — работающий прототип на демо-данных:
    показываем его онлайн и запускаем пилот на ваших данных.

erp:
  eyebrow: "Отраслевые ERP"
  title: "Восемь отраслей — одно проверенное ядро"
  lead: >-
    Заявка, согласование, закупка, склад и бюджет работают одинаково во всех версиях, а отраслевые модули говорят
    на языке вашего производства: весовая, вахта и допуски, металлургический и топливный балансы, сроки годности.
  chain: ["Заявка", "Согласование", "Заказ поставщику", "Склад", "Бюджет план-факт"]
  core_title: "Что есть в каждой версии"
  core:
    - { icon: flow, title: "Заявки и согласование", text: "Заявка с телефона проверяется по смете или бюджету; сверх бюджета — согласование только с основанием." }
    - { icon: ecommerce, title: "Снабжение и склад", text: "Заказ поставщику, приёмка, оплата; остатки по средней цене; списать больше остатка нельзя." }
    - { icon: gauge, title: "Бюджет план-факт", text: "Бюджет из Excel, обязательства и факт по статьям, отклонения — на панели руководителя." }
    - { icon: user-check, title: "Персонал и техника", text: "Табель, допуски, машино-часы и топливо против нормы." }
    - { icon: doc, title: "Отчёты и выгрузки", text: "Панели по ролям, отчёты для печати и PDF, Excel, выгрузки для 1С." }
    - { icon: globe, title: "Казахский и русский", text: "Интерфейс и уведомления на языке сотрудника, мобильная версия для телефона." }
    - { icon: lock, title: "Ваш контур", text: "Без внешних шрифтов и CDN: работает на ваших серверах и в закрытой сети." }
    - { icon: check-circle, title: "Проверено тестами", text: "Сквозные сценарии от заявки до бюджета проверяются автотестами." }

agents:
  eyebrow: "ИИ-агенты"
  title: "Цифровые сотрудники поверх вашей учётной системы"
  lead: >-
    Агент берёт на себя рутинную часть процесса — сверку, приём заявок, отбор откликов, разбор документации —
    и готовит черновик со ссылкой на источник. Решение принимает сотрудник.

pilot:
  eyebrow: "Как начать"
  title: "От демо до внедрения — четыре шага"
  lead: "На каждом шаге — понятный результат, который вы принимаете, прежде чем идти дальше."
  steps:
    - { title: "Демо", text: "Показываем продукт онлайн на сценариях вашей отрасли и отвечаем на вопросы." }
    - { title: "Обследование", text: "Разбираем процессы, документы и роли; готовим ТЗ, смету и показатели пилота." }
    - { title: "Пилот", text: "Запускаем на одном объекте, складе или филиале с вашими справочниками и данными." }
    - { title: "Внедрение", text: "Интеграции с 1С, ИС ЭСФ, ЕСУТД и ЭЦП, обучение сотрудников, сопровождение." }

