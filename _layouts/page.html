---
layout: default
---
{%- include vars.html -%}
<section class="page-hero">
  <div class="page-hero-bg" aria-hidden="true"></div>
  <div class="container">
    {%- if page.eyebrow %}
    <p class="eyebrow"><span class="dot"></span>{{ page.eyebrow }}</p>
    {%- endif %}
    <h1>{{ page.title }}</h1>
    {%- if page.lead %}
    <p class="lead">{{ page.lead }}</p>
    {%- endif %}
  </div>
</section>

<section class="section">
  <div class="container">
    <article class="prose legal-body">
      {{ content }}
    </article>
  </div>
</section>
